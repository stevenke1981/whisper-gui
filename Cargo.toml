[package]
name = "whisper-gui"
version = "0.1.0"
edition = "2021"

[features]
cuda   = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
slint = "1"
# Enable GPU at build time:
#   cargo build --release --features cuda    ← NVIDIA (RTX 3060 Ti)
#   cargo build --release --features vulkan  ← AMD / cross-platform
whisper-rs = "0.16"  # CPU-only default; add --features cuda or vulkan to build
cpal = "0.17"
arboard = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rfd = "0.15"
dirs = "6"
chrono = "0.4"
global-hotkey = "0.6"
enigo = "0.2"
languagetool-rust = { version = "3", default-features = false, features = ["native-tls"] }
harper-core = { version = "2", default-features = false }
symspell = "0.5"
ferrous-opencc = "0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[build-dependencies]
slint-build = "1"
